<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oddlysatisfying</title>
  <meta name="description" content="A tiny gallery of oddly satisfying interactive toys. Pop, pour, ripple, swing.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%237ee0c3'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">oddly<span>satisfying</span></h1>
    <nav id="toy-nav" class="toy-nav" aria-label="Toys"></nav>
    <button id="mute-btn" class="mute-btn" aria-label="Toggle sound" title="Toggle sound">🔊</button>
  </header>

  <main class="stage-wrap">
    <canvas id="stage"></canvas>
    <div id="toy-hint" class="toy-hint"></div>
    <div id="toy-toolbar" class="toy-toolbar"></div>
  </main>

  <footer class="footer">
    <p>no goals · (almost) no score · just vibes</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
